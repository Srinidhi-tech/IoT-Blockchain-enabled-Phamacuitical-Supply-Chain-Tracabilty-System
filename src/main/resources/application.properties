# Server Configuration
server.port=8080

# Application Name
spring.application.name=pharmatrace-platform

# H2 Database persistent file storage as requested: jdbc:h2:file:./data/coldchaindb
spring.datasource.url=jdbc:h2:file:./data/coldchaindb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console configuration (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# PharmaTrace Cold-Chain & RFID Custody Configuration (Strict Authorized Tag List)
pharmatrace.rfid.authorized-uids=2AF52B07,659A1707
pharmatrace.default-batch-id=VAX-B4920-COVID19
pharmatrace.default-product-name=mRNA-1273 Specialized Vaccine (Cold-Chain Grade)
pharmatrace.temperature.min=2.0
pharmatrace.temperature.max=8.0
pharmatrace.humidity.min=30.0
pharmatrace.humidity.max=65.0

# Blockchain Notarization & EVM Standby Configuration
pharmatrace.blockchain.rpc-url=http://127.0.0.1:8545
pharmatrace.blockchain.chain-id=1337
pharmatrace.blockchain.connect-timeout-ms=800
